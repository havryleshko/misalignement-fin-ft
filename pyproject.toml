[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misalignment-fit-ft"
version = "0.1.0"
description = "AI recommendation misalignment engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "alembic",
  "redis",
  "httpx",
  "pydantic",
  "python-dotenv",
  "requests-cache",
  "asyncpg",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
build-ft-dataset = "backend.scripts.dataset.build:main"
generate-ft-synthetic = "backend.scripts.dataset.generate:main"
ingest-ft-traces = "backend.scripts.dataset.ingest_traces:main"
merge-ft-dataset = "backend.scripts.dataset.merge:main"
validate-ft-dataset = "backend.scripts.dataset.validate:main"
split-ft-dataset = "backend.scripts.dataset.split:main"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["infra*", "docs*"]
