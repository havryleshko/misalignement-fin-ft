[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misalignment-fit-ft"
version = "0.1.0"
description = "AI recommendation misalignment engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "alembic",
  "redis",
  "httpx",
  "pydantic",
  "python-dotenv",
  "requests-cache",
  "asyncpg",
  "transformers",
  "datasets",
  "peft",
  "trl",
  "accelerate",
  "torch",
  "safetensors",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
build-ft-dataset = "backend.scripts.dataset.build:main"
generate-ft-synthetic = "backend.scripts.dataset.generate:main"
ingest-ft-traces = "backend.scripts.dataset.ingest_traces:main"
merge-ft-dataset = "backend.scripts.dataset.merge:main"
validate-ft-dataset = "backend.scripts.dataset.validate:main"
split-ft-dataset = "backend.scripts.dataset.split:main"
train-ft-lora = "backend.scripts.training.train_lora:main"
evaluate-ft-phase3-gate = "backend.scripts.training.evaluate_phase3_gate:main"
validate-ft-artifacts = "backend.scripts.training.validate_artifacts:main"
validate-ft-dataset-gate = "backend.scripts.training.validate_dataset_gate:main"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["infra*", "docs*"]
